<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes waveArm{0%,62%,100%{transform:rotate(-4deg)}68%,94%{transform:rotate(-16deg)}}
@keyframes waveFore{0%,60%,100%{transform:rotate(0deg)}70%,92%{transform:rotate(-150deg)}75%{transform:rotate(-124deg)}81%{transform:rotate(-156deg)}87%{transform:rotate(-128deg)}}
.spk{transform-box:fill-box;transform-origin:center}
.arm-r{transform-box:fill-box;transform-origin:16px 12px;transform:rotate(-4deg)}
.forearm{transform-box:fill-box;transform-origin:16px 10px}
.dizzy{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
.spk{animation:tw 2.6s ease-in-out infinite}
.bob{transform-box:view-box;animation:bob 4.5s ease-in-out infinite}
.sway{transform-box:view-box;transform-origin:485px 383px;animation:sway 6s ease-in-out infinite}
.rays{transform-box:view-box;transform-origin:485px 205px;animation:spin 90s linear infinite}
.dizzy{animation:spin 4s linear infinite}
.float{transform-box:view-box;transform-origin:center;animation:drift 5s ease-in-out infinite}
.arm-r{animation:waveArm 9s ease-in-out infinite}
.forearm{animation:waveFore 9s ease-in-out infinite}}
</style>
<title>Baner postaci Dych Dziki</title><desc>Baner do gry 2D w stylu gacha: bardzo wysoki, biało-srebrny robot w czarnej czapce stoi wyprostowany, kołysze się lekko i macha wolną ręką, w drugiej trzyma butelkę. Ciemnozielone tło z promieniami i iskrami, obok tytuł Dych Dziki i żywioł piwo.</desc>
